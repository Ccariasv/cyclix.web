spring.datasource.url=jdbc:h2:mem:cyclix;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.enabled=false
spring.flyway.validate-migration-naming=true
app.jwt.secret=cyclix-test-secret-change-me-please-123456
app.jwt.expiration-seconds=86400
app.device.api-key=cyclix-esp32-test-key
app.device.location.audit.active.min-distance-meters=15.0
app.device.location.audit.active.max-seconds-between-points=10
app.device.location.audit.idle.min-distance-meters=30.0
app.device.location.audit.idle.max-seconds-between-points=60
